name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Build & Test Verification Engine
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-test-jwt-secret-key-32-chars-long!"
      PORT: 5000

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Compile Contracts
        run: |
          cd backend && npx prisma generate
          cd ../blockchain && npx hardhat compile

      - name: Run Hardhat Blockchain Contract Tests
        run: |
          cd blockchain
          npx hardhat test

      - name: Run Backend Cryptography & Fraud Engine Tests
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-test-jwt-secret-key-32-chars-long!"
          PORT: 5000
        run: |
          cd backend
          npx prisma db push --skip-generate
          npm test

      - name: Build Production Frontend Application
        run: |
          cd frontend
          npm run build

      - name: Verify Documentation & Asset Integrity
        run: |
          test -f docs/logo.png
          test -f docs/architecture-flow.svg
          test -f docs/ui-showcase.svg
