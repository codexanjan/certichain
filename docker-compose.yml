version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: certichain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-certichain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certichain_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-certichain_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certichain} -d ${POSTGRES_DB:-certichain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
