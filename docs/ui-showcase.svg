<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#uiBg)" />

  <!-- Navbar Mockup -->
  <rect x="40" y="24" width="1120" height="64" rx="32" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="75" cy="56" r="14" fill="#00F2FE" />
  <text x="75" y="61" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="14" fill="#040711">C</text>
  <text x="100" y="62" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="18" fill="#FFFFFF">Certi<tspan fill="#00F2FE">Chain</tspan></text>
  <rect x="230" y="44" width="160" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
  <circle cx="245" cy="56" r="4" fill="#10B981" />
  <text x="258" y="60" font-family="monospace" font-size="11" fill="#34D399">EVM Localnet #42</text>
  
  <text x="780" y="61" font-family="system-ui" font-size="14" fill="#94A3B8">Verify Credentials</text>
  <text x="910" y="61" font-family="system-ui" font-size="14" fill="#94A3B8">Governance</text>
  <rect x="1010" y="38" width="130" height="36" rx="18" fill="url(#cyanGrad)" />
  <text x="1075" y="61" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="13" fill="#040711">Portal Access</text>

  <!-- Hero Content -->
  <text x="600" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="900" font-size="34" fill="#FFFFFF">
    Cryptographic Proof Meets Academic Integrity
  </text>
  <text x="600" y="185" text-anchor="middle" font-family="system-ui" font-size="15" fill="#94A3B8">
    Sub-second certificate authenticity validation powered by EVM smart contracts &amp; SHA-256 byte hashing
  </text>

  <!-- Live Verification Console Mockup -->
  <g transform="translate(180, 220)">
    <rect width="840" height="420" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />
    
    <!-- Tab Controls -->
    <rect x="20" y="20" width="800" height="48" rx="12" fill="rgba(0,0,0,0.4)" />
    <rect x="24" y="24" width="260" height="40" rx="8" fill="url(#cyanGrad)" />
    <text x="154" y="49" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="13" fill="#040711">Certificate ID Search</text>
    <text x="424" y="49" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="13" fill="#94A3B8">Drag &amp; Drop PDF File</text>
    <text x="694" y="49" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="13" fill="#94A3B8">Scan Dynamic QR Code</text>

    <!-- Search Input & Verification Button -->
    <rect x="30" y="90" width="600" height="50" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="50" y="121" font-family="monospace" font-size="15" fill="#38BDF8">CERT-2026-000123</text>
    <rect x="645" y="90" width="165" height="50" rx="12" fill="url(#cyanGrad)" />
    <text x="727" y="121" text-anchor="middle" font-family="system-ui" font-weight="800" font-size="14" fill="#040711">Verify on Chain ⚡</text>

    <!-- Verification Result Box -->
    <g transform="translate(30, 160)">
      <rect width="780" height="230" rx="16" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
      
      <!-- Status Badge -->
      <rect x="24" y="20" width="130" height="32" rx="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1.5" />
      <circle cx="40" cy="36" r="5" fill="#10B981" />
      <text x="52" y="41" font-family="monospace" font-weight="800" font-size="12" fill="#10B981">VERIFIED ✓</text>

      <text x="170" y="41" font-family="system-ui" font-weight="700" font-size="16" fill="#F8FAFC">
        Bachelor of Science in Computer Science
      </text>

      <!-- Details Grid -->
      <g transform="translate(24, 75)">
        <text x="0" y="0" font-family="system-ui" font-size="12" fill="#64748B">ISSUING INSTITUTION</text>
        <text x="0" y="22" font-family="system-ui" font-weight="700" font-size="14" fill="#E2E8F0">Massachusetts Institute of Technology (MIT)</text>

        <text x="360" y="0" font-family="system-ui" font-size="12" fill="#64748B">GRADUATE RECIPIENT</text>
        <text x="360" y="22" font-family="system-ui" font-weight="700" font-size="14" fill="#E2E8F0">Anjan Shrestha (MIT-CS-2026-089)</text>

        <text x="0" y="60" font-family="system-ui" font-size="12" fill="#64748B">ON-CHAIN SHA-256 DOCUMENT PROOF</text>
        <text x="0" y="80" font-family="monospace" font-size="11" fill="#38BDF8">7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069</text>

        <text x="0" y="115" font-family="system-ui" font-size="12" fill="#64748B">ETHEREUM BLOCKCHAIN TRANSACTION HASH</text>
        <text x="0" y="135" font-family="monospace" font-size="11" fill="#818CF8">0x5f3e9a1b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f</text>
      </g>

      <!-- Risk Meter Pill -->
      <g transform="translate(620, 20)">
        <rect width="136" height="40" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" />
        <text x="15" y="25" font-family="monospace" font-size="11" fill="#94A3B8">RISK SCORE: <tspan fill="#34D399" font-weight="800">0/100</tspan></text>
      </g>
    </g>
  </g>
</svg>
